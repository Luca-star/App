<!DOCTYPE html><html lang="it"><head><meta charset="utf-8"><title>Diario</title><link rel="manifest" href="manifest.webmanifest"><link rel="apple-touch-icon" href="apple-touch-icon.png"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"><meta name="apple-mobile-web-app-title" content="Diario"><meta name="theme-color" content="#050818">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<style>
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);--bg:rgba(255,255,255,.09);--c:rgba(12,16,40,.86);--t:#eef1ff;--a:#6d8cff;--b:rgba(150,170,255,.38);--o:rgba(60,140,90,.3)}
html,body{height:auto;margin:0;background:#050818;color:var(--t);font:16px/1.4 system-ui,-apple-system,sans-serif}
body{background:radial-gradient(ellipse at 20% 15%,rgba(110,60,200,.35),transparent 55%),radial-gradient(ellipse at 85% 55%,rgba(30,110,200,.3),transparent 55%),radial-gradient(ellipse at 30% 95%,rgba(200,60,140,.22),transparent 55%),#050818;background-attachment:fixed}
body::before,body::after{content:'';position:fixed;inset:0;pointer-events:none;z-index:0}
body::before{background-image:radial-gradient(1.5px 1.5px at 20px 30px,#fff,transparent),radial-gradient(1px 1px at 90px 120px,#cfe0ff,transparent),radial-gradient(1.5px 1.5px at 160px 60px,#fff,transparent),radial-gradient(1px 1px at 55px 170px,#ffe9c9,transparent),radial-gradient(2px 2px at 130px 150px,#fff,transparent);background-size:120px 130px}
body::after{background-image:radial-gradient(1px 1px at 40px 70px,#fff,transparent),radial-gradient(1.5px 1.5px at 210px 20px,#bcd0ff,transparent),radial-gradient(1px 1px at 120px 230px,#fff,transparent),radial-gradient(2px 2px at 260px 140px,#fff,transparent);background-size:200px 180px}
#app{position:relative;z-index:1;display:flex;flex-direction:column-reverse;gap:230px;padding:120px 10px 160px}
section{width:82%;box-sizing:border-box;background:var(--c);border:1px solid var(--b);border-radius:16px;padding:10px;box-shadow:0 0 28px rgba(110,140,255,.35),0 0 90px rgba(140,90,255,.2)}
h2{font-size:15px;margin:0 0 8px;font-weight:600}h2 b{display:inline-block;min-width:22px;color:var(--a)}
h3{margin:0 0 6px;font-size:14px}
img{max-width:100%}.im{width:100%;border-radius:8px;display:block}
.ir{display:flex;gap:6px;margin:8px 0}.ir input{flex:1;font:inherit;padding:8px;border:1px solid var(--b);border-radius:8px;background:var(--bg);color:var(--t);min-width:0}
button,select{font:inherit;padding:8px 12px;border:1px solid var(--a);background:var(--a);color:#fff;border-radius:8px}
select{background:var(--bg);color:var(--t);border-color:var(--b)}
.bd{border:1px solid var(--b);border-radius:8px;padding:8px;margin-top:8px;min-height:44px}.bd.o{background:var(--o)}
.ch{display:inline-flex;gap:8px;align-items:center;background:var(--bg);border:1px solid var(--b);border-radius:16px;padding:4px 10px;margin:3px}
.ch i{font-style:normal;opacity:.6}
.q,.row{display:flex;gap:8px;overflow-x:auto;padding:6px 0}
.sq{flex:0 0 96px;height:96px;background:var(--a);color:#fff;border-radius:6px;padding:6px;font-size:13px;overflow:auto}
.cv{position:relative;overflow:hidden;border-radius:8px}.cv>img{display:block;width:100%}
.rc{position:absolute;border:2px solid #f4b400;background:rgba(244,180,0,.2);pointer-events:none}
.mp{margin-bottom:8px}.cv>.pc{width:10%;height:auto}.pc{position:absolute;border:1.5px solid #aaa;border-radius:4px}.pc.w{border-color:var(--a)}
.card{flex:0 0 94%;border:1px solid var(--b);border-radius:8px;padding:6px}.card .card{flex-basis:92%}
.pin{position:absolute;transform:translate(-50%,-100%);background:#ffe14d;color:#222;font-size:12px;padding:2px 6px;border-radius:6px;max-width:60%}
.bar{display:flex;gap:6px;margin-top:6px;flex-wrap:wrap}.bar button{padding:6px 10px;font-size:14px}.bar .x{background:none;color:var(--t);border-color:var(--b)}
.ov{position:fixed;inset:0;background:rgba(0,0,0,.75);overflow:auto;z-index:9;padding:12px}.bx{background:#0c1028;border-radius:12px;padding:12px;max-width:none;margin:0}
.hint{font-size:13px;opacity:.7;margin:4px 0}.add{flex:0 0 70px;font-size:28px}
section:nth-child(odd){align-self:flex-start}section:nth-child(even){align-self:flex-end}
.im{max-height:32vh;object-fit:contain}
html::before{content:'';position:fixed;inset:0;pointer-events:none;z-index:0;background-image:radial-gradient(1px 1px at 15px 25px,#fff,transparent),radial-gradient(1px 1px at 75px 95px,#dfe8ff,transparent),radial-gradient(1.5px 1.5px at 110px 45px,#fff,transparent),radial-gradient(1px 1px at 45px 130px,#fff,transparent),radial-gradient(1px 1px at 140px 120px,#ffe9c9,transparent);background-size:150px 150px}
section:nth-child(6){width:97%;align-self:center}
.mode{position:fixed;top:calc(env(safe-area-inset-top,0px) + 8px);left:50%;transform:translateX(-50%);z-index:5;background:rgba(12,16,40,.9);border:1px solid var(--b);border-radius:20px;padding:4px 12px;font-size:13px;pointer-events:none;white-space:nowrap}
#snd{position:fixed;right:10px;bottom:calc(env(safe-area-inset-bottom,0px) + 10px);z-index:6;display:flex;gap:8px}.sb{width:44px;height:44px;border-radius:50%;padding:0;background:rgba(12,16,40,.9);border:1px solid var(--b);font-size:20px}
section:nth-child(10){width:97%;align-self:center}.ch i{padding:0 4px}
</style></head><body><div id="app"></div><div id="snd"></div>

function ac(){if(!AC){try{AC=new(window.AudioContext||window.webkitAudioContext)();mst=AC.createGain();mst.gain.value=.85;
 const cv=AC.createConvolver(),n=AC.sampleRate*5,im=AC.createBuffer(2,n,AC.sampleRate);
 for(let c=0;c<2;c++){const d=im.getChannelData(c);for(let i=0;i<n;i++)d[i]=(Math.random()*2-1)*Math.pow(1-i/n,2.6)}
 cv.buffer=im;const wt=AC.createGain();wt.gain.value=.6;mst.connect(AC.destination);mst.connect(cv);cv.connect(wt);wt.connect(AC.destination)}catch(e){AC=null;return null}}

function tone(f,t0,dur,g,dest){const o=AC.createOscillator(),v=AC.createGain();o.frequency.setValueAtTime(f,t0);v.gain.setValueAtTime(0,t0);v.gain.linearRampToValueAtTime(g,t0+.05);v.gain.exponentialRampToValueAtTime(.0001,t0+dur);o.connect(v);v.connect(dest||mst);o.start(t0);o.stop(t0+dur+.05)}

  o.frequency.setValueAtTime(a[0],t);o.frequency.exponentialRampToValueAtTime(a[1],t+1);v.gain.setValueAtTime(0,t);v.gain.linearRampToValueAtTime(.2,t+.2);v.gain.exponentialRampToValueAtTime(.0001,t+1.8);o.connect(v);v.connect(mst);o.start(t);o.stop(t+1.9);
  tone(a[1]*1.5,t+.5,2.4,.07)}};

 g.gain.setValueAtTime(0,t);g.gain.linearRampToValueAtTime(.1,t+6);sw.frequency.value=.08;sg.gain.value=.035;sw.connect(sg);sg.connect(g.gain);
 const os=[[73.42,1],[110,.9],[146.83,.8],[185,.55],[220,.5],[329.63,.35],[554.37,.18],[880,.08]].flatMap(([x,k],i)=>[-5,5].map(dt=>{const o=AC.createOscillator(),og=AC.createGain();o.type=i%3==2?'triangle':'sine';o.frequency.value=x;o.detune.value=dt+(i-3);og.gain.value=k*.55;o.connect(og);og.connect(lp);o.start(t);return o}));
